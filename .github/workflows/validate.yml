name: validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sanity checks (frontmatter, links, manifests, scripts, denylist)
        run: python3 scripts/check.py
      - name: Build the ZIP
        run: bash scripts/package.sh

  latex-smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Minimal TeX Live (abnTeX2 deliberately NOT from apt — the setup script must fetch it)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra latexmk poppler-utils unzip curl
      - name: setup-sandbox-latex.sh installs abnTeX2 + babel-portuges into ~/texmf
        run: bash skills/tcc-abnt/scripts/setup-sandbox-latex.sh
      - name: Compile the canonical abnTeX2 model with compile-check.sh
        run: |
          MODEL="$(find "$HOME/texmf" -name abntex2-modelo-trabalho-academico.tex | head -1)"
          test -n "$MODEL"
          mkdir -p /tmp/modelo && cp "$(dirname "$MODEL")"/abntex2-modelo-* /tmp/modelo/
          cd /tmp/modelo && mv abntex2-modelo-trabalho-academico.tex main.tex
          bash "$GITHUB_WORKSPACE/skills/tcc-abnt/scripts/compile-check.sh" main.tex
      - name: Upload the model's build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: modelo-build-logs
          path: |
            /tmp/modelo/build/*.log
            /tmp/modelo/build/*.blg
          if-no-files-found: ignore
      - name: audit-tex.py and init-workflow.py on the model
        run: |
          cd /tmp/modelo
          python3 "$GITHUB_WORKSPACE/skills/tcc-abnt/scripts/audit-tex.py" . --quiet --out audit.md --json audit.json
          python3 "$GITHUB_WORKSPACE/skills/tcc-abnt/scripts/init-workflow.py" . --build-helpers
          test -f .tcc-workflow/STATUS.md && test -f .tcc-workflow/tools/audit-tex.py
          python3 - <<'PY'
          import json
          log = json.load(open('audit.json'))['log']
          assert log['pages'] and 60 <= log['pages'] <= 120, log['pages']   # the model renders ~80 pages
          assert not log['undefined_citations'], log['undefined_citations']
          assert not log['undefined_references'], log['undefined_references']
          assert not log['errors'], log['errors']
          PY
      - name: Negative smoke test - compile-check.sh must fail on an undefined citation
        run: |
          rm -rf /tmp/modelo-bad && mkdir -p /tmp/modelo-bad
          cp -r /tmp/modelo/. /tmp/modelo-bad/
          cd /tmp/modelo-bad
          rm -rf build
          sed -i 's/\\end{document}/\\cite{doesnotexist}\n\\end{document}/' main.tex
          grep -q 'doesnotexist' main.tex
          rc=0; bash "$GITHUB_WORKSPACE/skills/tcc-abnt/scripts/compile-check.sh" main.tex || rc=$?
          # 3 = PDF built but undefined citations/refs or errors; anything else means a different failure
          test "$rc" -eq 3 || { echo "expected exit 3 (undefined citation), got $rc"; exit 1; }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, latex-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the ZIP
        run: bash scripts/package.sh
      - name: Attach dist/tcc-abnt.zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tcc-abnt.zip
          generate_release_notes: true
