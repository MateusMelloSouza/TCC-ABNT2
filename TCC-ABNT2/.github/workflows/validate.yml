name: validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sanity checks (frontmatter, links, manifests, scripts, denylist)
        run: python3 scripts/check.py
      - name: dist/tcc-abnt.zip matches the sources
        run: bash scripts/package.sh --check

  latex-smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Minimal TeX Live (abnTeX2 deliberately NOT from apt — the setup script must fetch it)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra latexmk poppler-utils unzip curl
      - name: setup-sandbox-latex.sh installs abnTeX2 + babel-portuges into ~/texmf
        run: bash skills/tcc-abnt/scripts/setup-sandbox-latex.sh
      - name: Compile the canonical abnTeX2 model with compile-check.sh
        run: |
          MODEL="$(find "$HOME/texmf" -name abntex2-modelo-trabalho-academico.tex | head -1)"
          test -n "$MODEL"
          mkdir -p /tmp/modelo && cp "$(dirname "$MODEL")"/abntex2-modelo-* /tmp/modelo/
          cd /tmp/modelo && mv abntex2-modelo-trabalho-academico.tex main.tex
          bash "$GITHUB_WORKSPACE/skills/tcc-abnt/scripts/compile-check.sh" main.tex
      - name: audit-tex.py and init-workflow.py on the model
        run: |
          cd /tmp/modelo
          python3 "$GITHUB_WORKSPACE/skills/tcc-abnt/scripts/audit-tex.py" . --quiet --out audit.md --json audit.json
          python3 "$GITHUB_WORKSPACE/skills/tcc-abnt/scripts/init-workflow.py" . --build-helpers
          test -f .tcc-workflow/STATUS.md && test -f .tcc-workflow/tools/audit-tex.py
          python3 -c "import json; p=json.load(open('audit.json'))['log']['pages']; assert 60 <= p <= 120, p"   # the model renders ~80 pages

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, latex-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the ZIP
        run: bash scripts/package.sh
      - name: Attach dist/tcc-abnt.zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tcc-abnt.zip
          generate_release_notes: true
