name: validate

# Runs when this folder is the root of its own repository (GitHub only reads
# .github/workflows at the repository root).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sanity checks (frontmatter, links, manifests, scripts, evals, denylist)
        run: python3 scripts/check.py
      - name: dist/academic-latex.zip matches the sources
        run: bash scripts/package.sh --check
      - name: Unit tests (static; the LaTeX ones skip without TeX)
        run: python3 -m unittest discover -s tests -v

  latex:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live with the skill's own setup script (apt route, fonts for acmart)
        run: bash skills/academic-latex/scripts/setup-sandbox-latex.sh --fonts --lang german,portuguese
      - name: Unit tests, every skeleton variant, publisher and thesis-class documents
        run: bash tests/run-tests.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, latex]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the ZIP
        run: bash scripts/package.sh
      - name: Attach dist/academic-latex.zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/academic-latex.zip
          generate_release_notes: true
